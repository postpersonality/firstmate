<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base target="_blank">
  <style>
    body{margin:0;padding:28px 34px 48px;font:15px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#29332c;background:#fffef9;overflow-wrap:anywhere}
    article{max-width:920px}h1,h2,h3{font-family:Georgia,serif;font-weight:normal;line-height:1.25;margin:1.4em 0 .6em}h1{font-size:30px;margin-top:0}h2{font-size:23px}h3{font-size:19px}
    a{color:#3e5137}img{max-width:100%}hr{border:0;border-top:1px solid #dedfd3}blockquote{margin:0;padding-left:16px;border-left:3px solid #dedfd3;color:#74796f}
    table{display:block;overflow-x:auto;border-collapse:collapse;margin:0 0 1em}th,td{border:1px solid #dedfd3;padding:6px 10px;text-align:left;vertical-align:top}th{background:#edf1e3}
    code{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4f1e9;padding:1px 4px;border-radius:4px}pre{background:#f4f1e9;border:1px solid #dedfd3;border-radius:7px;padding:14px 16px;overflow-x:auto}pre code{padding:0}
  </style>
</head>
<body><article>{{body}}</article></body>
</html>
